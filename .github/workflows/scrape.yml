name: Weekly Scrape

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install packages
        run: |
          pip install requests beautifulsoup4 lxml pandas
      
      - name: Create data folder
        run: mkdir -p data
      
      - name: Run scraper
        run: python scraper.py
