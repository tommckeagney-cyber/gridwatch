name: Weekly Data Scrape

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml pandas
    
    - name: Create data directory
      run: mkdir -p data
    
    - name: Run scraper and generate files
      run: |
        python << 'EOF'
import requests
from bs4 import BeautifulSoup
import re
import time
import json
from datetime import datetime, timedelta
import pandas as pd

print("🕷️ Starting GridWatch scraper...")
print()

# ============ COUNTY COORDINATES ============
county_coords = {
    "Carlow": [52.8377, -6.9298], "Cavan": [53.9908, -7.3606],
    "Clare": [52.8627, -9.0259], "Cork": [51.8985, -8.4756],
    "Donegal": [54.6549, -8.1109], "Dublin": [53.3498, -6.2603],
    "Galway": [53.2707, -9.0568], "Kerry": [52.1546, -9.5231],
    "Kildare": [53.1584, -6.9028], "Kilkenny": [52.6538, -7.2493],
    "Laois": [53.0000, -7.3000], "Leitrim": [54.0000, -8.0000],
    "Limerick": [52.6638, -8.6267], "Longford": [53.7277, -7.7997],
    "Louth": [53.9257, -6.4827], "Mayo": [53.8378, -9.4001],
    "Meath": [53.6046, -6.6567], "Monaghan": [54.2500, -7.0000],
    "Offaly": [53.1000, -7.5000], "Roscommon": [53.6291, -8.1868],
    "Sligo": [54.2693, -8.4693], "Tipperary": [52.6807, -7.8246],
    "Waterford": [52.2593, -7.1101], "Westmeath": [53.5000, -7.5000],
    "Wexford": [52.4798, -6.4576], "Wicklow": [52.9915, -6.3647],
}

# ============ ENERGY KEYWORDS ============
ENERGY_KEYWORDS = {
    "wind": ["wind farm", "wind turbine", "wind energy", "wind power", "windfarm"],
    "solar": ["solar farm", "solar pv", "photovoltaic", "solar panel", "solar energy"],
    "bess": ["battery storage", "battery energy storage", "bess", "grid-scale battery"],
    "grid": ["substation", "grid connection", "transmission line", "overhead line", "underground cable"],
    "offshore": ["offshore wind", "floating wind", "offshore energy", "marine energy"],
    "biogas": ["anaerobic digestion", "biomethane", "biogas", "biomass", "bioenergy"],
}

COUNTIES = ["Carlow","Cavan","Clare","Cork","Donegal","Dublin","Galway","Kerry",
    "Kildare","Kilkenny","Laois","Leitrim","Limerick","Longford","Louth",
    "Mayo","Meath","Monaghan","Offaly","Roscommon","Sligo","Tipperary",
    "Waterford","Westmeath","Wexford","Wicklow"]

BASE_URL = "https://www.pleanala.ie"
LISTS_URL = f"{BASE_URL}/en-ie/lists/cases"

# ============ HELPER FUNCTIONS ============
def get_page(url, params=None):
    try:
        time.sleep(1.5)
        r = requests.get(url, params=params, headers={"User-Agent": "GridWatch/1.0"}, timeout=20)
        r.raise_for_status()
        return BeautifulSoup(r.text, "html.parser")
    except Exception as e:
        print(f"  Request failed: {e}")
        return None

def last_n_fridays(n):
    today = datetime.today()
    days_back = (today.weekday() - 4) % 7
    friday = today - timedelta(days=days_back)
    return [(friday - timedelta(weeks=i)).strftime("%d/%m/%Y") for i in range(n)]

def fetch_weekly_list(list_type, week):
    soup = get_page(LISTS_URL, params={"list": list_type, "week": week})
    if not soup:
        return []
    
    cases = []
    blocks = soup.find_all(lambda tag: tag.name in ("div","article","li") and 
                          re.search(r"\b[35]\d{5}\b|ABP-\d+", tag.get_text()))
    
    for block in blocks:
        text = block.get_text(" ", strip=True)
        m = re.search(r"\b([35]\d{5})\b|ABP-([\d-]+)", text)
        if not m:
            continue
        
        ref = m.group(1) or "ABP-" + m.group(2)
        h = block.find(["h2","h3","h4","strong","a"])
        title = h.get_text(strip=True) if h else text[:120]
        
        desc_m = re.search(r"(?:Description|Cur s[ií]os)[:\s]+(.+?)(?:\n|Status|Date|$)", text, re.I|re.S)
        description = desc_m.group(1).strip()[:500] if desc_m else text[:300]
        
        county = "Unknown"
        for c in COUNTIES:
            if re.search(rf"\b{c}\b", text, re.I):
                county = c
                break
        
        st_m = re.search(r"(?:Status|Stádas)[:\s]+(.+?)(?:\n|Date|$)", text, re.I|re.S)
        status = st_m.group(1).strip()[:120] if st_m else "Unknown"
        
        date_m = re.search(r"(?:Lodged|Dáta an taiscthe)[:\s]+(\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4})", text, re.I)
        date_lodged = date_m.group(1) if date_m else week
        
        nr = re.search(r"\d{5,6}", ref)
        url = f"{BASE_URL}/en-ie/case/{nr.group()}" if nr else BASE_URL
        
        combined = (title + " " + description).lower()
        energy_type = "other"
        is_energy = False
        
        for etype, kws in ENERGY_KEYWORDS.items():
            if any(kw in combined for kw in kws):
                is_energy = True
                energy_type = etype
                break
        
        if is_energy:
            lat, lon = county_coords.get(county, [53.4129, -8.2439])
            
            cases.append({
                "ref": ref,
                "title": title,
                "description": description,
                "county": county,
                "status": status,
                "date_lodged": date_lodged,
                "date_signed": None,
                "eiar": False,
                "nis": False,
                "list_type": list_type,
                "source_url": url,
                "energy_type": energy_type,
                "is_energy": is_energy,
                "week_ending": week,
                "latitude": lat,
                "longitude": lon
            })
    
    return cases

# ============ RUN SCRAPER ============
all_cases = []
seen_refs = set()
week_dates = last_n_fridays(4)

for week in week_dates:
    print(f"📅 Processing week: {week}")
    for ltype in ["N", "D", "I", "J"]:
        cases = fetch_weekly_list(ltype, week)
        for c in cases:
            if c["ref"] not in seen_refs:
                seen_refs.add(c["ref"])
                all_cases.append(c)

print()
print(f"✅ Found {len(all_cases)} energy cases")
print()

# Save to JSON
with open("data/cases.json", "w") as f:
    json.dump(all_cases, f, indent=2, default=str)

print("💾 Saved to data/cases.json")

# ============ GENERATE GEOJSON ============
geojson = {
    "type": "FeatureCollection",
    "features": []
}

for case in all_cases:
    lat = case.get("latitude")
    lon = case.get("longitude")
    
    if lat is None:
        county = case.get("county", "Unknown")
        if county in county_coords:
            lat, lon = county_coords[county]
        else:
            continue
    
    geojson["features"].append({
        "type": "Feature",
        "geometry": {"type": "Point", "coordinates": [lon, lat]},
        "properties": {
            "ref": case.get("ref", "N/A"),
            "title": case.get("title", "Unknown")[:100],
            "county": case.get("county", "Unknown"),
            "energy_type": case.get("energy_type", "other"),
            "status": case.get("status", "Unknown"),
            "date_lodged": case.get("date_lodged", "Unknown"),
            "source_url": case.get("source_url", "#")
        }
    })

with open("data/gridwatch.geojson", "w") as f:
    json.dump(geojson, f, indent=2)

print(f"✅ GeoJSON created: data/gridwatch.geojson ({len(geojson['features'])} features)")

# ============ GENERATE KML ============
energy_colors = {
    "wind": "ff4285f4", "solar": "fff4b842", "bess": "ff34a853",
    "grid": "ffaa46ff", "offshore": "ff1cb5e0", "biogas": "ffff7043",
    "other": "ff9e9e9e"
}

kml_header = '''<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>
    <name>GridWatch Ireland - Energy Projects</name>
    <open>1</open>
    <description>Real-time energy planning applications in Ireland. Updated weekly.</description>
'''

styles = ""
for etype, color in energy_colors.items():
    styles += f'''
    <Style id="style_{etype}">
        <IconStyle>
            <scale>1.2</scale>
            <Icon>
                <href>http://maps.google.com/mapfiles/kml/pushpin/red-pushpin.png</href>
            </Icon>
        </IconStyle>
    </Style>
'''

placemarks = ""
for case in all_cases:
    lat = case.get("latitude")
    lon = case.get("longitude")
    
    if lat is None:
        county = case.get("county", "Unknown")
        if county in county_coords:
            lat, lon = county_coords[county]
        else:
            continue
    
    etype = case.get("energy_type", "other")
    title = case.get("title", "Unknown")[:80]
    ref = case.get("ref", "N/A")
    status = case.get("status", "Unknown")
    date_lodged = case.get("date_lodged", "Unknown")
    url = case.get("source_url", "#")
    
    placemarks += f'''
    <Placemark>
        <name>{title}</name>
        <styleUrl>#style_{etype}</styleUrl>
        <description>
            <![CDATA[
            <div style="font-family: Arial; max-width: 300px;">
                <b>{title}</b><br>
                <b>Ref:</b> {ref}<br>
                <b>Type:</b> {etype.upper()}<br>
                <b>Status:</b> {status}<br>
                <b>Lodged:</b> {date_lodged}<br>
                <a href="{url}" target="_blank">View Details →</a>
            </div>
            ]]>
        </description>
        <Point>
            <coordinates>{lon},{lat},0</coordinates>
        </Point>
    </Placemark>
'''

kml_footer = '''
</Document>
</kml>'''

with open("data/gridwatch.kml", "w") as f:
    f.write(kml_header + styles + placemarks + kml_footer)

print(f"✅ KML created: data/gridwatch.kml ({len(all_cases)} projects)")

# ============ GENERATE CSV ============
df = pd.DataFrame([f["properties"] for f in geojson["features"]])
df["longitude"] = [f["geometry"]["coordinates"][0] for f in geojson["features"]]
df["latitude"] = [f["geometry"]["coordinates"][1] for f in geojson["features"]]
df.to_csv("data/gridwatch_gis.csv", index=False)

print(f"✅ CSV created: data/gridwatch_gis.csv")
print()
print("=" * 50)
print(f"📊 Total projects exported: {len(all_cases)}")
print("=" * 50)
EOF

    - name: List generated files
      run: |
        echo "Files in data directory:"
        ls -la data/
    
    - name: Commit and push updates
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add data/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Weekly data scrape with GIS and KML export" && git push)
